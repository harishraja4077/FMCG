<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Issue - Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard-layout">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="logo"><div class="logo-icon"><img src="images/logo.webp" alt="Stackly"></div></a>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">
        <div class="sidebar-section-title">Main</div>
        <a href="userdashboard.html" class="sidebar-link"><span class="icon"><i class="fas fa-th-large"></i></span> Dashboard</a>
        <a href="userorders.html" class="sidebar-link"><span class="icon"><i class="fas fa-shopping-bag"></i></span> My Orders <span class="badge">12</span></a>
        <a href="userfavorites.html" class="sidebar-link"><span class="icon"><i class="fas fa-heart"></i></span> Favorites</a>
        <a href="userwallet.html" class="sidebar-link"><span class="icon"><i class="fas fa-wallet"></i></span> Wallet</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">Shop</div>
        <a href="product.html" class="sidebar-link"><span class="icon"><i class="fas fa-store"></i></span> Browse Products</a>
        <a href="usersubscriptions.html" class="sidebar-link"><span class="icon"><i class="fas fa-sync-alt"></i></span> Subscriptions</a>
        <a href="userdelivery.html" class="sidebar-link"><span class="icon"><i class="fas fa-truck"></i></span> Delivery Tracking</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">Support</div>
        <a href="contact.html" class="sidebar-link"><span class="icon"><i class="fas fa-headset"></i></span> Help Center</a>
        <a href="userreport.html" class="sidebar-link active"><span class="icon"><i class="fas fa-flag"></i></span> Report Issue</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">Account</div>
        <a href="usersettings.html" class="sidebar-link"><span class="icon"><i class="fas fa-cog"></i></span> Settings</a>
        <a href="signin.html" class="sidebar-link" onclick="localStorage.clear()"><span class="icon"><i class="fas fa-sign-out-alt"></i></span> Logout</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"><img src="https://ui-avatars.com/api/?name=U&background=0d6e3f&color=fff&bold=true" alt="User"></div>
        <div class="sidebar-user-info">
          <h4 id="sidebarUserName">User</h4>
          <p id="sidebarUserRole">Customer</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="dashboard-main">
    <!-- Topbar -->
    <div class="dashboard-topbar">
      <div class="dashboard-topbar-left">
        <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <div>
          <h1>Welcome back, <span id="topbarGreeting"></span></h1>
          <p>We're here to help — report any issues with your orders</p>
        </div>
      </div>
      <div class="dashboard-topbar-right">
        <div class="topbar-search" onclick="window.location.href='404.html'" style="cursor:pointer;"><input type="text" placeholder="Search products, orders..."><i class="fas fa-search icon"></i></div>
        <button class="topbar-icon-btn" onclick="window.location.href='404.html'"><i class="fas fa-bell"></i><span class="notif-dot"></span></button>
        <div class="topbar-email"><i class="fas fa-envelope"></i><span class="email-text" id="topbarEmail">user@example.com</span></div>
      </div>
    </div>

    <!-- Section Label -->
    <div class="dashboard-section-label"><i class="fas fa-flag"></i> Report an Issue</div>

    <!-- Report Form -->
    <div class="dash-card" style="max-width:700px;">
      <div class="dash-card-header"><h3>Submit a Report</h3></div>
      <div class="dash-card-body">
        <form style="display:flex;flex-direction:column;gap:20px;">
          <div>
            <label style="display:block;font-weight:500;margin-bottom:6px;">Issue Type</label>
            <select style="width:100%;padding:12px 16px;border:1px solid #e2e8f0;border-radius:10px;font-family:'Poppins',sans-serif;font-size:0.95rem;background:#fff;color:var(--text-dark);outline:none;">
              <option value="">Select issue type</option>
              <option value="order">Order Not Received</option>
              <option value="damaged">Damaged Product</option>
              <option value="wrong">Wrong Item Delivered</option>
              <option value="billing">Billing Issue</option>
              <option value="subscription">Subscription Problem</option>
              <option value="delivery">Delivery Delay</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div>
            <label style="display:block;font-weight:500;margin-bottom:6px;">Order ID (optional)</label>
            <input type="text" placeholder="e.g. #ORD-7839" style="width:100%;padding:12px 16px;border:1px solid #e2e8f0;border-radius:10px;font-family:'Poppins',sans-serif;font-size:0.95rem;outline:none;">
          </div>
          <div>
            <label style="display:block;font-weight:500;margin-bottom:6px;">Description</label>
            <textarea rows="5" placeholder="Please describe the issue in detail..." style="width:100%;padding:12px 16px;border:1px solid #e2e8f0;border-radius:10px;font-family:'Poppins',sans-serif;font-size:0.95rem;outline:none;resize:vertical;"></textarea>
          </div>
          <div>
            <label style="display:block;font-weight:500;margin-bottom:6px;">Priority</label>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:8px 16px;border:1px solid #e2e8f0;border-radius:8px;font-size:0.9rem;"><input type="radio" name="priority" value="low"> Low</label>
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:8px 16px;border:1px solid #e2e8f0;border-radius:8px;font-size:0.9rem;"><input type="radio" name="priority" value="medium" checked> Medium</label>
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:8px 16px;border:1px solid #e2e8f0;border-radius:8px;font-size:0.9rem;"><input type="radio" name="priority" value="high"> High</label>
            </div>
          </div>
          <div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem;"><i class="fas fa-paper-plane" style="margin-right:8px;"></i>Submit Report</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="script.js"></script>
<script>
  const email = localStorage.getItem('userEmail') || 'user@example.com';
  const role = localStorage.getItem('userRole') || 'user';
  const name = email.split('@')[0];
  document.getElementById('topbarEmail').textContent = email;
  document.getElementById('topbarGreeting').textContent = name.charAt(0).toUpperCase() + name.slice(1);
  document.getElementById('sidebarUserName').textContent = name.charAt(0).toUpperCase() + name.slice(1);

  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('active'); if (document.getElementById('sidebar').classList.contains('open')) { lockScroll(); } else { unlockScroll(); } }
  function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('active'); unlockScroll(); }

  document.querySelectorAll('.chart-bar[data-h]').forEach(b => { b.style.height = b.dataset.h + '%'; });

  if (!localStorage.getItem('userEmail')) window.location.href = 'signin.html';
</script>
</body>
</html>
