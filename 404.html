<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="error-page">
    <!-- Background Shapes -->
    <div class="error-shapes">
      <div class="error-shape"></div>
      <div class="error-shape"></div>
      <div class="error-shape"></div>
      <div class="error-shape"></div>
      <div class="error-shape"></div>
    </div>

    <div class="error-content">
      <div class="error-code">404</div>
      <h1>Oops! Page Not Found</h1>
      <p>The page you're looking for doesn't exist, has been moved, or is temporarily unavailable. Let's get you back on track.</p>
      <div class="error-buttons">
        <a href="index.html" class="btn btn-secondary magnetic">
          <i class="fas fa-home"></i> Back to Home
        </a>
        <a href="javascript:history.back()" class="btn btn-outline" style="border-color:rgba(255,255,255,0.3);color:#fff;">
          <i class="fas fa-arrow-left"></i> Go Back
        </a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
